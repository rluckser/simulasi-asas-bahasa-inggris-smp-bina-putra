<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
<title>A student receiving a certificate on a stage</title>
<rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<!-- curtain background -->
<rect x="0" y="0" width="400" height="210" fill="#0f766e"/>
<path d="M0 0 L60 0 L40 210 L0 210 Z" fill="#115e59"/>
<path d="M100 0 L160 0 L140 210 L100 210 Z" fill="#115e59"/>
<path d="M200 0 L260 0 L240 210 L200 210 Z" fill="#115e59"/>
<path d="M300 0 L360 0 L340 210 L300 210 Z" fill="#115e59"/>
<!-- stage floor -->
<rect x="0" y="210" width="400" height="90" fill="#92400e"/>
<rect x="0" y="210" width="400" height="10" fill="#b45309"/>
<!-- teacher on the left handing the certificate -->
<circle cx="140" cy="130" r="17" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
<path d="M140 147 L140 208 L126 258 M140 208 L154 258" stroke="#1e40af" stroke-width="7" stroke-linecap="round" fill="none"/>
<path d="M140 162 L172 150" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
<!-- student on the right receiving it -->
<circle cx="265" cy="130" r="17" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
<path d="M265 147 L265 208 L250 258 M265 208 L280 258" stroke="#7c2d12" stroke-width="7" stroke-linecap="round" fill="none"/>
<path d="M265 162 L232 150" stroke="#7c2d12" stroke-width="6" stroke-linecap="round"/>
<!-- certificate held between them -->
<rect x="185" y="128" width="46" height="32" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
<line x1="192" y1="140" x2="224" y2="140" stroke="#b45309" stroke-width="2"/>
<line x1="192" y1="148" x2="224" y2="148" stroke="#b45309" stroke-width="2"/>
<line x1="192" y1="156" x2="212" y2="156" stroke="#b45309" stroke-width="2"/>
<circle cx="222" cy="124" r="6" fill="#facc15" stroke="#b45309" stroke-width="1.5"/>
</g>
</svg>
